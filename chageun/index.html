<style>
:root{
  --bg:#f5f2ec; --bg-2:#efe9df; --card:#ffffff;
  --ink:#1b2321; --ink-2:#3c4744; --muted:#6f7a76; --line:#e5ded2;
  --teal:#0f766e; --teal-dark:#0a5b55; --teal-soft:#e4f2ef; --teal-ink:#0b5f59;
  --amber:#f0a53a; --amber-soft:#fff6e6;
  --danger:#b4362f; --danger-soft:#fdeceb;
  --r-lg:22px; --r:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(27,35,33,.05), 0 10px 26px -16px rgba(27,35,33,.28);
  --shadow-lg:0 2px 4px rgba(27,35,33,.05), 0 22px 48px -24px rgba(27,35,33,.35);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 12% -8%, #eaf4f1 0%, rgba(234,244,241,0) 62%), radial-gradient(700px 380px at 100% 0%, #fbf1e2 0%, rgba(251,241,226,0) 60%);
  background-repeat:no-repeat; background-attachment:fixed;
}
h1,h2,h3,h4{margin:0; line-height:1.3; letter-spacing:-0.025em}
p{margin:0}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:inherit}
ul{margin:0; padding:0; list-style:none}
:focus-visible{outline:3px solid #7cc3ba; outline-offset:2px}
.wrap{width:100%; max-width:1060px; margin:0 auto; padding:0 20px}
.wrap.narrow{max-width:760px}
@media (max-width:520px){ .wrap{padding:0 16px} }

/* ---------- header ---------- */
.app-header,.detail-header{
  position:sticky; top:0; z-index:30;
  background:rgba(245,242,236,.88); backdrop-filter:saturate(1.3) blur(12px); -webkit-backdrop-filter:saturate(1.3) blur(12px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex; align-items:center; gap:12px; min-height:66px; padding-top:8px; padding-bottom:8px}
.brand{display:flex; align-items:center; gap:12px; min-width:0; flex:1}
.logo{
  display:grid; place-items:center; width:42px; height:42px; border-radius:9px; flex:none;
  background:#0B2151; color:#fff; box-shadow:0 8px 16px -10px rgba(11,33,81,.85); overflow:hidden;
}
.logo svg{width:42px; height:42px; display:block}
.brand-line{display:flex; align-items:baseline; gap:7px}
.brand-text h1{font-size:19px; font-weight:800; letter-spacing:-0.03em}
.brand-en{font-size:9.5px; font-weight:800; letter-spacing:.16em; color:#9aa39f}
.brand-text p{font-size:12.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:42px; padding:0 14px; border-radius:12px; border:1px solid var(--line);
  background:rgba(255,255,255,.8); font-size:14px; font-weight:700; color:var(--ink-2); cursor:pointer;
  transition:background .15s, transform .15s;
}
.icon-btn:hover{background:#fff}
.icon-btn:active{transform:scale(.97)}
.icon-btn.back{width:42px; padding:0; font-size:18px}
.dh-title{flex:1; min-width:0; font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dh-actions{display:flex; gap:8px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:50px; padding:0 20px; border-radius:14px; border:1px solid transparent;
  font-size:15.5px; font-weight:750; cursor:pointer; text-decoration:none;
  transition:transform .12s, background .15s, box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(160deg,#128378,#0c6a63); color:#fff; box-shadow:0 10px 22px -14px rgba(15,118,110,.95)}
.btn.primary:hover{background:linear-gradient(160deg,#0f766e,#0a5b55)}
.btn.ghost{background:#fff; border-color:var(--line); color:var(--ink-2)}
.btn.ghost:hover{border-color:#d3cab9; background:#fffdf9}
.btn.light{background:#fff; color:var(--teal-ink)}
.btn.transparent{background:rgba(255,255,255,.18); color:#fff; border-color:rgba(255,255,255,.5)}
.btn.small{min-height:40px; padding:0 14px; font-size:14px; border-radius:11px}
.btn.grow{flex:1}
.btn.full{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed}
.link-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:none; border:0; padding:10px 6px; min-height:44px;
  color:var(--muted); font-size:13.5px; text-decoration:underline; text-underline-offset:3px; cursor:pointer;
}
.link-btn.danger{color:var(--danger)}

/* ---------- home ---------- */
.home{padding-bottom:60px}
.search-row{position:relative; margin:22px 0 14px}
.search-row .search-ico{position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:16px; opacity:.55; pointer-events:none}
#search{
  width:100%; min-height:52px; padding:0 44px 0 44px; border-radius:15px;
  border:1px solid var(--line); background:#fff; font-size:16px; box-shadow:var(--shadow);
  appearance:none;
}
#search::-webkit-search-cancel-button{display:none}
#search:focus{outline:none; border-color:#9ed3cb; box-shadow:0 0 0 4px rgba(15,118,110,.12)}
.search-clear{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:36px; height:36px; border-radius:50%; border:0; background:var(--bg-2); color:var(--muted); cursor:pointer; font-size:14px;
}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin-bottom:6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; min-height:40px; padding:0 16px; border-radius:999px; border:1px solid var(--line);
  background:#fff; color:var(--ink-2); font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s,transform .12s;
}
.chip:active{transform:scale(.97)}
.chip.active{background:var(--teal); border-color:var(--teal); color:#fff; box-shadow:0 8px 18px -12px rgba(15,118,110,.9)}
.list-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:14px 0 14px}
.list-head h2{font-size:17px; font-weight:800}
.list-head h2 .count{color:var(--muted); font-weight:700; font-size:14px; margin-left:6px}
.grid{display:grid; grid-template-columns:1fr; gap:14px}
@media (min-width:640px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px} }
@media (min-width:980px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.card{
  display:flex; flex-direction:column; gap:8px; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px 18px 16px; box-shadow:var(--shadow); cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#ddd4c5}
.card:active{transform:translateY(-1px) scale(.995)}
.card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.emoji{
  width:48px; height:48px; flex:none; border-radius:15px; display:grid; place-items:center; font-size:25px;
  background:linear-gradient(150deg,#f1f8f6,#e7f1ee); border:1px solid #e0ece8;
}
.tag-row{display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end}
.tag{font-size:11.5px; font-weight:800; padding:4px 9px; border-radius:999px; background:var(--bg-2); color:#5c6663; letter-spacing:-.01em}
.tag.easy{background:var(--teal-soft); color:var(--teal-ink)}
.tag.mine{background:#fdf0dd; color:#8a5b06}
.card h3{font-size:17.5px; font-weight:800; margin-top:4px}
.summary{
  font-size:13.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; min-height:41px;
}
.meta{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12.5px; color:#5d6864; font-weight:650; margin-top:auto; padding-top:2px}
.mini-bar{height:7px; border-radius:999px; background:#eee8dc; overflow:hidden; margin-top:8px}
.mini-bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#37b3a5,#0f766e)}
.mini-label{font-size:12px; color:var(--teal-ink); font-weight:800; margin-top:4px}
.card-btn{
  margin-top:10px; min-height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:800; background:var(--bg-2); color:var(--ink-2);
}
.card-btn.primary{background:var(--teal); color:#fff}
.card:hover .card-btn.primary{background:var(--teal-dark)}
.empty{
  grid-column:1/-1; text-align:center; padding:46px 18px; background:#fff; border:1px dashed var(--line); border-radius:var(--r-lg);
}
.empty .e-emoji{font-size:34px}
.empty h3{font-size:16px; margin:8px 0 4px}
.empty p{font-size:13.5px; color:var(--muted); margin-bottom:14px}
.footnote{font-size:12.5px; color:var(--muted); text-align:center; margin:26px 0 0; line-height:1.6}
.copyright{font-size:11.5px; color:#9aa39f; text-align:center; margin:10px 0 0; letter-spacing:.02em}

/* ---------- guide detail ---------- */
.guide-main{padding:22px 0 calc(40px + var(--safe-b))}
.guide-hero{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow)}
.hero-head{display:flex; gap:12px; align-items:flex-start}
.hero-emoji{
  font-size:26px; line-height:1; width:50px; height:50px; flex:none; display:grid; place-items:center;
  border-radius:15px; background:linear-gradient(150deg,#f1f8f6,#e7f1ee); border:1px solid #e0ece8;
}
.guide-hero h1{font-size:21px; font-weight:850; margin:0 0 4px}
.hero-summary{font-size:13.5px; color:var(--ink-2); line-height:1.55}
.hero-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.pill{font-size:12.5px; font-weight:750; padding:6px 11px; border-radius:999px; background:var(--bg-2); color:#4f5a56}
.pill:first-child{background:var(--teal-soft); color:var(--teal-ink)}
.materials{margin-top:16px; padding-top:14px; border-top:1px dashed var(--line)}
.materials strong{font-size:12.5px; color:var(--muted); font-weight:800; letter-spacing:.02em}
.mat-chips{display:flex; flex-wrap:nowrap; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:3px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.mat-chips::-webkit-scrollbar{display:none}
@media (min-width:760px){ .mat-chips{flex-wrap:wrap} }
.mat{font-size:13px; font-weight:650; padding:6px 11px; border-radius:9px; background:#fbfaf6; border:1px solid var(--line); color:var(--ink-2); flex:none; white-space:nowrap}
.segmented{
  display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:18px 0 14px; padding:4px;
  background:#eae4d8; border-radius:14px;
}
.segmented button{
  min-height:44px; border:0; border-radius:11px; background:transparent; color:#5f6a66;
  font-size:14.5px; font-weight:800; cursor:pointer; transition:background .15s,color .15s,box-shadow .15s;
}
.segmented button.active{background:#fff; color:var(--teal-ink); box-shadow:0 2px 8px -4px rgba(27,35,33,.35)}
.progress-block{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px 17px; box-shadow:var(--shadow)}
.pb-top{display:flex; align-items:baseline; justify-content:space-between; font-size:13.5px; color:var(--muted); font-weight:750}
.pb-top strong{font-size:19px; color:var(--teal-ink); font-weight:850; letter-spacing:-.03em}
.bar{height:11px; border-radius:999px; background:#ece6da; overflow:hidden; margin:9px 0 8px}
.bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#3cb9aa,#0f766e); transition:width .45s cubic-bezier(.3,.9,.3,1)}
.feedback{font-size:13px; color:var(--ink-2); font-weight:650}
.time-line{font-size:12px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums}

.step-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:22px 20px 20px; box-shadow:var(--shadow-lg); margin-top:14px; position:relative; overflow:hidden;
}
.step-card::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,#3cb9aa,#0f766e)}
.step-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.step-badge{
  font-size:12px; font-weight:850; letter-spacing:.06em; color:var(--teal-ink);
  background:var(--teal-soft); padding:6px 11px; border-radius:999px;
}
.step-min{font-size:12.5px; color:var(--muted); font-weight:750}
.step-card h2{font-size:22px; font-weight:850; line-height:1.32; letter-spacing:-.03em}
.step-desc{font-size:15px; color:var(--ink-2); margin-top:9px; line-height:1.65}
.tip{margin-top:16px; background:var(--amber-soft); border-left:4px solid var(--amber); border-radius:4px 12px 12px 4px; padding:12px 14px}
.tip-label{font-size:12.5px; font-weight:850; color:#8a5b06; margin-bottom:3px}
.tip p{font-size:13.5px; color:#6d5327; line-height:1.6}
.step-timer{margin-top:16px; font-size:12.5px; color:var(--muted); font-weight:650}
.step-timer strong{font-variant-numeric:tabular-nums; color:var(--teal-ink); font-size:14px}
.step-nav{display:flex; gap:10px; margin-top:16px}
.step-nav .btn{box-shadow:var(--shadow)}
.step-foot{display:flex; justify-content:center; margin-top:2px}
.dots{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:14px 0 4px}
.dot{
  width:34px; height:34px; border-radius:11px; border:1px solid var(--line); background:#fff;
  font-size:12.5px; font-weight:800; color:var(--muted); cursor:pointer;
}
.dot.done{background:var(--teal-soft); border-color:#c6e4de; color:var(--teal-ink)}
.dot.cur{border-color:var(--teal); color:var(--teal-ink); box-shadow:0 0 0 2px rgba(15,118,110,.15) inset}

.checklist{margin-top:14px; display:grid; gap:10px}
.check-item{
  display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:14px 15px; box-shadow:var(--shadow); transition:background .2s,border-color .2s;
}
.check-item.done{background:#f3f9f7; border-color:#d3e8e3}
.checkbox{
  width:29px; height:29px; flex:none; border-radius:50%; border:2px solid #cdc5b6; background:#fff;
  color:#fff; font-size:15px; font-weight:900; cursor:pointer; display:grid; place-items:center; margin-top:1px;
  transition:background .18s, border-color .18s, transform .12s;
}
.checkbox:active{transform:scale(.9)}
.check-item.done .checkbox{background:var(--teal); border-color:var(--teal)}
.check-body{flex:1; min-width:0}
.check-title{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; font-size:15px; font-weight:800}
.check-title .cn{color:var(--muted); font-size:12.5px; font-weight:800}
.check-item.done .check-title .ct{color:#6b7a75; text-decoration:line-through; text-decoration-thickness:1.5px}
.check-title .cm{font-size:11.5px; color:var(--muted); font-weight:700; margin-left:auto}
.check-desc{font-size:13px; color:var(--muted); margin-top:4px; line-height:1.55}
.check-item.done .check-desc{color:#8a9691}
.check-tip{margin-top:7px}
.check-tip summary{font-size:12.5px; font-weight:800; color:#8a5b06; cursor:pointer; list-style:none; display:inline-flex; gap:5px; align-items:center; padding:3px 0}
.check-tip summary::-webkit-details-marker{display:none}
.check-tip summary::before{content:"💡"; font-size:12px}
.check-tip p{font-size:12.5px; color:#6d5327; background:var(--amber-soft); padding:9px 11px; border-radius:9px; margin-top:6px; line-height:1.55}
.all-done-banner{
  margin-top:14px; background:var(--teal-soft); border:1px solid #cde7e1; color:var(--teal-ink);
  border-radius:var(--r); padding:13px 15px; font-size:14px; font-weight:800; text-align:center;
}

.done-panel{
  margin-top:14px; border-radius:var(--r-lg); padding:30px 20px 24px; text-align:center; color:#fff;
  background:linear-gradient(155deg,#12907f,#0a5b55); box-shadow:var(--shadow-lg); position:relative; overflow:hidden;
}
.done-emoji{font-size:44px; line-height:1; animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4); opacity:0}100%{transform:scale(1); opacity:1}}
.done-panel h2{font-size:24px; font-weight:850; margin-top:8px}
.done-sub{font-size:13.5px; opacity:.9; margin-top:5px}
.done-stats{display:flex; justify-content:center; gap:8px; margin:18px 0 20px}

var memoryStore = {};
var storageOK = true;
try {
  localStorage.setItem('__probe__','1');

function rawGet(k){
  try { return localStorage.getItem(k); } catch (e) { return memoryStore[k] || null; }
}
function rawSet(k,v){
  try { localStorage.setItem(k,v); } catch (e) { memoryStore[k] = v; }
}

function uid(prefix){
  return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function defaultState(){ return { version:1, customGuides:[], progress:{}, updatedAt:null }; }

function toNum(v, def){
  var n = Number(v);
  if (!isFinite(n) || n < 0) return def;
  return n;
}
function clampStr(v, max){
  return String(v == null ? '' : v).slice(0, max);
}
function sanitizeGuide(g){
  if (!g || typeof g !== 'object' || !g.title || !Array.isArray(g.steps)) return null;
  var steps = [];
  for (var i=0;i<g.steps.length;i++){
    var s = g.steps[i];
    if (!s || typeof s !== 'object' || !s.title) continue;
    steps.push({
      id: (typeof s.id === 'string' && s.id) ? s.id : uid('s'),
      title: clampStr(s.title, 120),
      desc: clampStr(s.desc, 600),
      tip: clampStr(s.tip, 600),
      min: Math.max(1, Math.round(toNum(s.min, 5)))
    });
  }
  if (!steps.length) return null;
  return {
    id: (typeof g.id === 'string' && g.id) ? g.id : ('c-' + uid('g')),
    emoji: (typeof g.emoji === 'string' && g.emoji) ? g.emoji.slice(0,4) : '📋',
    title: clampStr(g.title, 80),
    category: CATEGORIES.indexOf(g.category) >= 0 ? g.category : '기타',
    minutes: Math.max(1, Math.round(toNum(g.minutes, 30))),
    difficulty: DIFFS.indexOf(g.difficulty) >= 0 ? g.difficulty : '초보 추천',
    summary: clampStr(g.summary, 200),
    materials: Array.isArray(g.materials) ? g.materials.filter(function(m){ return typeof m === 'string' && m.trim(); }).map(function(m){ return clampStr(m, 40); }).slice(0,20) : [],
    steps: steps
  };
}
function sanitizeProgress(p){
  p = (p && typeof p === 'object') ? p : {};
  var done = {};
  if (p.done && typeof p.done === 'object') {
    for (var k in p.done) { if (p.done[k] === true) done[k] = true; }
  }
  return {
    done: done,
    idx: Math.max(0, Math.round(toNum(p.idx, 0))),
    seconds: toNum(p.seconds, 0),
    stepBase: toNum(p.stepBase, 0),
    updatedAt: toNum(p.updatedAt, Date.now())
  };
}
function normalizeState(d){
  var s = defaultState();
  if (!d || typeof d !== 'object') return s;
  if (Array.isArray(d.customGuides)) {
    for (var i=0;i<d.customGuides.length;i++){
      var g = sanitizeGuide(d.customGuides[i]);
      if (g) s.customGuides.push(g);
    }
  }
  if (d.progress && typeof d.progress === 'object') {
    for (var k in d.progress) s.progress[k] = sanitizeProgress(d.progress[k]);
  }
  return s;
}
function load(){
  var raw = rawGet(STORE_KEY);
  if (!raw) return defaultState();
  try { return normalizeState(JSON.parse(raw)); } catch (e) { return defaultState(); }
}
var state = load();
var saveTimer = null;
function save(now){
  state.updatedAt = Date.now();
  var payload = JSON.stringify(state);
  if (now) {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    rawSet(STORE_KEY, payload);
    return;
  }
  if (saveTimer) return;
  saveTimer = setTimeout(function(){ saveTimer = null; rawSet(STORE_KEY, payload); }, 220);
}
window.addEventListener('beforeunload', function(){ save(true); });
document.addEventListener('visibilitychange', function(){ if (document.hidden) save(true); });

function doneCount(g, p){
  if (!p) return 0;
  var n = 0;
  for (var i=0;i<g.steps.length;i++) if (p.done[g.steps[i].id]) n++;
  return n;
}

function fmtDur(sec){

  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return h + '시간 ' + m + '분';
  if (m > 0) return m + '분 ' + s + '초';
  return s + '초';
}

  if (pct >= 75) return '거의 다 왔어요. 마지막 한두 단계만 남았습니다.';
  if (pct >= 50) return '절반을 넘었어요. 이 속도면 곧 끝납니다.';
  if (pct >= 25) return '좋아요, 흐름을 타고 있어요.';

function parseHash(){

  if (parts[0] === 'edit' && parts[1]) return { view:'edit', id:decodeURIComponent(parts[1]) };

function confettiHTML(){
  var colors = ['#ffd166','#ffffff','#9be7da','#ffb4a2','#c7f0e6'];
  var out = '';
  for (var i=0;i<26;i++){
    var left = Math.round(Math.random()*100);
    var delay = (Math.random()*0.7).toFixed(2);
    var dur = (1.7 + Math.random()*1.1).toFixed(2);
    var color = colors[i % colors.length];
    out += '<i style="left:' + left + '%;background:' + color + ';animation-delay:' + delay + 's;animation-duration:' + dur + 's"></i>';
  }
  return '<div class="confetti" aria-hidden="true">' + out + '</div>';
}

/* =========================================================
   7. 타이머
   ========================================================= */
function startTicker(){
  if (ticker) return;
  lastTick = Date.now();
  ticker = setInterval(tick, 1000);
}
function stopTicker(){
  if (ticker) { clearInterval(ticker); ticker = null; }
}
function tick(){
  var route = parseHash();
  if (route.view !== 'guide') { stopTicker(); return; }
  if (document.visibilityState === 'hidden') { lastTick = Date.now(); return; }
  var g = getGuide(route.id);
  if (!g) return;
  var p = state.progress[g.id];
  if (!p) return;
  var now = Date.now();
  var dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt < 0 || dt > 10) dt = 1;
  p.seconds += dt;
  if (Math.floor(p.seconds) % 15 === 0) save();
  updateTimerLabels();
  var tl = document.querySelector('[data-timer="guide"]');
  if (tl) tl.textContent = fmtDur(p.seconds);
}
function updateTimerLabels(){
  var route = parseHash();
  if (route.view !== 'guide') return;
  var g = getGuide(route.id);
  if (!g) return;
  var p = state.progress[g.id];
  if (!p) return;
  var els = document.querySelectorAll('[data-timer="step"]');
  for (var i=0;i<els.length;i++) els[i].textContent = mmss(p.seconds - (p.stepBase || 0));
  var gEl = document.querySelector('[data-timer="guide"]');
  if (gEl) gEl.textContent = fmtDur(p.seconds);
}

function saveGuide(){
  var g = ui.editing;
  if (!g) return;
  var title = (g.title || '').trim();
  if (!title) { toast('가이드 제목을 입력해 주세요'); return; }
  var good = g.steps.filter(function(s){ return (s.title||'').trim(); });
  if (!good.length) { toast('단계를 하나 이상 입력해 주세요'); return; }
  var clean = sanitizeGuide({
    id: g.id, emoji: g.emoji, title: title, category: g.category, minutes: g.minutes,
    difficulty: g.difficulty, summary: g.summary, materials: g.materials,
    steps: good.map(function(s){
      return { id: s.id || uid('s'), title: s.title.trim(), desc: (s.desc||'').trim(), tip: (s.tip||'').trim(), min: s.min || 5 };
    })
  });
  if (!clean) { toast('가이드를 저장하지 못했어요. 입력값을 확인해 주세요'); return; }
  var existed = -1;

function exportJSON(){
  var data = {
    app:'step-guide', version:1, exportedAt:new Date().toISOString(),
    customGuides: state.customGuides, progress: state.progress
  };
  var text = JSON.stringify(data, null, 2);
  var blob = new Blob([text], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  function pad(n){ return (n<10?'0':'') + n; }
  a.href = url;
  a.download = 'step-guide-backup-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast('JSON 파일로 내보냈어요 · ' + state.customGuides.length + '개 가이드');
}
function importJSON(text){
  var data;
  try { data = JSON.parse(text); } catch (e) { toast('❌ JSON 형식이 아니에요'); return; }
  if (!data || typeof data !== 'object') { toast('❌ 백업 데이터를 읽지 못했어요'); return; }
  var guides = Array.isArray(data.customGuides) ? data.customGuides : (Array.isArray(data.guides) ? data.guides : []);
  if (!guides.length && !data.progress) { toast('❌ 가이드 데이터를 찾지 못했어요'); return; }
  var idMap = {};
  var added = 0;
  guides.forEach(function(raw){
    var g = sanitizeGuide(raw);
    if (!g) return;
    var occupied = getGuide(g.id) || g.id.indexOf('tpl-') === 0;
    if (occupied || !g.id) {
      var old = g.id;
      g.id = 'c-' + uid('g');
      if (old) idMap[old] = g.id;
    }
    var seen = {};
    g.steps.forEach(function(s){
      if (!s.id || seen[s.id]) s.id = uid('s');
      seen[s.id] = true;
    });
    state.customGuides.unshift(g);
    added++;
  });
  var progAdded = 0;
  if (data.progress && typeof data.progress === 'object') {
    Object.keys(data.progress).forEach(function(pid){
      var target = idMap[pid] || pid;
      if (getGuide(target) && !state.progress[target]) {
        state.progress[target] = sanitizeProgress(data.progress[pid]);
        progAdded++;
      }
    });
  }
  save(true);
  render(true);
  toast('✅ 가이드 ' + added + '개, 진행 기록 ' + progAdded + '개를 가져왔어요');
}

var lastRouteKey = '';
function render(force){

  if (route.view === 'guide') renderGuide(route.id);
  else if (route.view === 'new' || route.view === 'edit') {
    if (!ui.editing) {
      if (route.view === 'edit') {
        var g = getGuide(route.id);
        if (g && g.custom) {
          ui.editing = { id:g.id, emoji:g.emoji, title:g.title, category:g.category, minutes:g.minutes,
            difficulty:g.difficulty, summary:g.summary, materials:g.materials.slice(), steps:g.steps.map(function(s){ return {id:s.id,title:s.title,desc:s.desc,tip:s.tip,min:s.min}; }) };
          ui.editingMode = 'edit';

      }

function openGuide(id){
  var g = getGuide(id);
  if (!g) return;
  progressOf(g.id, true);
  go('#/guide/' + encodeURIComponent(id));
}
function markDone(g, stepIndex){
  var p = progressOf(g.id, true);
  var st = g.steps[stepIndex];
  if (!st) return;
  var before = pctOf(g, p);
  p.done[st.id] = true;
  var after = pctOf(g, p);
  p.updatedAt = Date.now();
  if (after < 100) {
    var next = stepIndex + 1;
    while (next < g.steps.length && p.done[g.steps[next].id]) next++;
    if (next >= g.steps.length) {
      next = g.steps.length - 1;
      for (var i=0;i<g.steps.length;i++){ if (!p.done[g.steps[i].id]) { next = i; break; } }
    }
    p.idx = next;
    p.stepBase = p.seconds;
  }
  save(true);
  renderGuide(g.id);
  if (after >= 100) { toast('🎉 모든 단계를 마쳤어요!'); return; }
  if (before < 50 && after >= 50) { toast('절반 넘었어요! 이대로만 가면 돼요 👏'); return; }
  if (after >= 100 - 100/g.steps.length && before < 100) { toast('마지막 단계만 남았어요!'); return; }
  toast('잘하고 있어요 · ' + after + '%');
}

      markDone(gg, cur);
      break;
    case 'step-prev':
      var gp = getGuide(parseHash().id);
      if (!gp) break;
      var pr = progressOf(gp.id, true);
      pr.idx = Math.max(0, (pr.idx || 0) - 1);
      pr.stepBase = pr.seconds;
      save();
      renderGuide(gp.id);
      break;
    case 'step-skip':
      var gs = getGuide(parseHash().id);
      if (!gs) break;
      var ps = progressOf(gs.id, true);
      var skipIdx = Math.min(ps.idx || 0, gs.steps.length - 1);
      ps.idx = Math.min(gs.steps.length - 1, skipIdx + 1);
      ps.stepBase = ps.seconds;
      save();
      renderGuide(gs.id);
      toast('이 단계는 나중에 체크리스트에서 할 수 있어요');
      break;
    case 'step-goto':
      var gj = getGuide(parseHash().id);
      if (!gj) break;
      var pj = progressOf(gj.id, true);
      pj.idx = Math.max(0, Math.min(gj.steps.length - 1, Number(el.getAttribute('data-index')) || 0));
      pj.stepBase = pj.seconds;
      save();
      renderGuide(gj.id);
      break;
    case 'toggle-step':
      var gt = getGuide(parseHash().id);
      if (!gt) break;
      var pt = progressOf(gt.id, true);
      var sid = el.getAttribute('data-id');
      var beforePct = pctOf(gt, pt);
      if (pt.done[sid]) delete pt.done[sid]; else pt.done[sid] = true;
      pt.updatedAt = Date.now();
      var afterPct = pctOf(gt, pt);
      var firstLeft = -1;
      for (var k=0;k<gt.steps.length;k++){ if (!pt.done[gt.steps[k].id]) { firstLeft = k; break; } }
      if (firstLeft !== -1) pt.idx = firstLeft;
      save(true);
      renderGuide(gt.id);
      if (afterPct >= 100) toast('🎉 모든 단계를 체크했어요!');

    t.value = '';
  }
});
